<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 240px; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #14171c; color: #e8ecf1; }
    .wrap { padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { font-size: 12px; color: #9aa4b2; margin: 0 0 10px; line-height: 1.4; }
    a { color: #6ea0ff; }
    button { width: 100%; padding: 9px; border: none; border-radius: 8px; background: #3d7bff; color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }
    button:hover { background: #316bec; }
    .note { font-size: 10.5px; color: #7a8494; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📊 MT5 Web Advisor</h1>
    <p>Відкрий <a href="https://web.metatrader.app/terminal" target="_blank">web.metatrader.app</a> — панель зʼявиться праворуч на графіку.</p>
    <button id="toggle">Показати / сховати панель</button>
    <div class="note">Радить LONG/SHORT + SL/TP. Не торгує.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
